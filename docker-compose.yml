version: "3.9"
services:
  postgres1:
    image: docker.artifacts.primary/postgres:14
    environment:
      POSTGRES_DB: my_app_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak_poc
    volumes:
      - ./keycloak/dev_data:/opt/keycloak/data/import
      - ./keycloak/dev_data:/export
      - ./keycloak/themes/primary:/opt/keycloak/themes/primary
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"
      KC_LOG: file,console
      KC_LOG_LEVEL: INFO
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    entrypoint: ["/bin/bash", "-c"]
    command: 
      - /opt/keycloak/bin/kc.sh import --dir /opt/keycloak/data/import --override true && /opt/keycloak/bin/kc.sh start-dev --import-realm
    ports:
      - 8080:8080


  